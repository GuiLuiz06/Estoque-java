<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Estoque</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#17202a;color:#fff;padding:18px 24px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:17px}
main{max-width:1000px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:10px;padding:16px;margin-bottom:16px}
input,select,button{width:100%;padding:9px;margin:4px 0;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
button{background:#2563eb;color:#fff;border:0;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#msg{display:none;padding:10px;border-radius:6px;margin-bottom:16px}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
.low{color:#b91c1c;font-weight:600}
</style>
</head>
<body>
<header><h1>Controle de Estoque</h1></header>
<main>
<div id="msg" role="status"></div>
<div class="grid">
  <form class="card" id="cat"><h2>Nova categoria</h2>
    <input name="nome" placeholder="Nome" required>
    <button>Cadastrar</button></form>
 
  <form class="card" id="prod"><h2>Novo produto</h2>
    <input name="nome" placeholder="Nome" required>
    <input name="preco" type="number" min="0.01" step="0.01" placeholder="Preço" required>
    <input name="estoqueMinimo" type="number" min="0" step="1" placeholder="Estoque mínimo" required>
    <select name="categoriaId" id="cats" required></select>
    <button>Cadastrar</button></form>
 
  <form class="card" id="mov"><h2>Movimentar estoque</h2>
    <select name="tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
    <select name="produtoId" id="prods" required></select>
    <input name="quantidade" type="number" min="1" step="1" placeholder="Quantidade" required>
    <button>Registrar</button></form>
</div>
 
<div class="card"><h2>Produtos <span id="info"></span></h2>
  <div class="wrap"><table>
    <thead><tr><th>ID</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Mín.</th></tr></thead>
    <tbody id="tp"></tbody></table></div></div>
 
<div class="card"><h2>Movimentações</h2>
  <div class="wrap"><table>
    <thead><tr><th>ID</th><th>Produto</th><th>Tipo</th><th>Qtd</th><th>Data</th></tr></thead>
    <tbody id="tm"></tbody></table></div></div>
</main>
 
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const brl = n => Number(n).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const opts = (l, f) => '<option value="">Selecione...</option>' + l.map(x => `<option value="${esc(x.id)}">${f(x)}</option>`).join("");
let t;
 
function aviso(txt, erro) {
  const m = $("msg");
  m.textContent = txt; m.className = erro ? "err" : "ok"; m.style.display = "block";
  clearTimeout(t); t = setTimeout(() => m.style.display = "none", 4000);
}
 
async function api(url, method = "GET", body) {
  const r = await fetch(url, {method, headers:{"Content-Type":"application/json"}, body: body && JSON.stringify(body)});
  const txt = await r.text();
  let d; try { d = txt ? JSON.parse(txt) : null } catch { d = txt }
  if (!r.ok) throw new Error(d?.message || d?.error || "Operação não concluída. Confira os dados.");
  return d;
}
 
async function carregar() {
  try {
    const [c, p, m] = await Promise.all([api("/categorias"), api("/produtos"), api("/movimentacoes")]);
    const baixo = x => x.estoque <= x.estoqueMinimo;
    $("cats").innerHTML = opts(c, x => esc(x.nome));
    $("prods").innerHTML = opts(p, x => `${esc(x.nome)} (estoque: ${esc(x.estoque)})`);
    $("info").textContent = `— ${p.length} produtos, ${c.length} categorias, ${p.filter(baixo).length} com estoque baixo`;
    $("tp").innerHTML = p.map(x => `<tr class="${baixo(x) ? "low" : ""}">
      <td>${esc(x.id)}</td><td>${esc(x.nome)}</td><td>${esc(x.categoria?.nome ?? "-")}</td>
      <td>${brl(x.preco)}</td><td>${esc(x.estoque)}${baixo(x) ? " ⚠" : ""}</td><td>${esc(x.estoqueMinimo)}</td></tr>`).join("")
      || '<tr><td colspan="6">Nenhum produto.</td></tr>';
    $("tm").innerHTML = [...m].sort((a, b) => new Date(b.data) - new Date(a.data)).map(x => `<tr>
      <td>${esc(x.id)}</td><td>${esc(x.produto?.nome ?? "-")}</td><td>${esc(x.tipo)}</td>
      <td>${esc(x.quantidade)}</td><td>${new Date(x.data).toLocaleString("pt-BR")}</td></tr>`).join("")
      || '<tr><td colspan="5">Nenhuma movimentação.</td></tr>';
  } catch (e) { aviso(e.message, true); }
}
 
function form(id, enviar, ok) {
  $(id).addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, b = f.querySelector("button"), d = Object.fromEntries(new FormData(f));
    b.disabled = true;
    try { await enviar(d); f.reset(); aviso(ok); await carregar(); }
    catch (err) { aviso(err.message, true); }
    finally { b.disabled = false; }
  });
}
 
form("cat", d => api("/categorias", "POST", {nome: d.nome.trim()}), "Categoria cadastrada!");
 
form("prod", d => api("/produtos?categoriaId=" + encodeURIComponent(d.categoriaId), "POST",
  {nome: d.nome.trim(), preco: +d.preco, estoqueMinimo: +d.estoqueMinimo}), "Produto cadastrado!");
 
form("mov", d => {
  if (!d.produtoId) throw new Error("Selecione um produto.");
  if (!(+d.quantidade > 0) || !Number.isInteger(+d.quantidade)) throw new Error("Quantidade inválida.");
  return api(`/movimentacoes/${d.tipo}?produtoId=${encodeURIComponent(d.produtoId)}&quantidade=${+d.quantidade}`, "POST");
}, "Movimentação registrada!");
 
carregar();
</script>
</body>
</html>
